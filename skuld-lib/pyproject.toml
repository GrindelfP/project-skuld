[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skuld-lib"
# A ".postN" suffix marks a fix-only revision of the release before it:
# same code, repackaged, no API change. It sorts after the plain release
# so `pip install -U` picks it up. Local "+N" versions are not an option —
# PEP 440 allows them but PyPI rejects them outright, so ".postN" is the
# only way to express "rebuilt, not new" here.
version = "0.5.0"
description = "A neural network based numerical integration library"
authors = [{name = "GrindelfP", email = "grindelf.perlomutrovij@gmail.com"}]
# Non-commercial with attribution, plus a prohibition on military and
# weapons use. Not an OSI-approved licence, so it has no SPDX identifier
# and is declared as a LicenseRef under PEP 639. LICENSE is a
# byte-identical copy of the repository root licence.
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
readme = "README.md"
keywords = [
    "neural-network",
    "numerical-integration",
    "quadrature",
    "antiderivative",
    "physics",
    "torch",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    # Floors are versions known to provide everything the library uses;
    # caps stop an untested major release from being pulled in silently.
    "torch>=2.1,<3",
    "numpy>=1.24,<3",
    "mpmath>=1.3,<2",
    "scikit-learn>=1.3,<2",
]
requires-python = ">=3.11"

[project.urls]
Homepage = "https://github.com/GrindelfP/project-skuld"
Repository = "https://github.com/GrindelfP/project-skuld"
Issues = "https://github.com/GrindelfP/project-skuld/issues"

[tool.setuptools.packages.find]
include = ["skuld*"]