[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skuld-lib"
# 0.4.0+R is a PEP 440 local version: the same 0.4.0 release, rebuilt
# with packaging fixes. A trailing "+N" marks a fix-only revision of the
# preceding release; a behaviour change gets a real minor bump instead.
version = "0.4.0+R"
description = "A neural network based numerical integration library"
authors = [{name = "GrindelfP", email = "grindelf.perlomutrovij@gmail.com"}]
# Non-commercial with attribution, plus a prohibition on military and
# weapons use. Not an OSI-approved licence, so it has no SPDX identifier
# and is declared as a LicenseRef under PEP 639. LICENSE is a
# byte-identical copy of the repository root licence.
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
readme = "README.md"
keywords = [
    "neural-network",
    "numerical-integration",
    "quadrature",
    "antiderivative",
    "physics",
    "torch",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "torch",     
    "numpy",
    "mpmath",
    "scikit-learn",
    "typing"
]
requires-python = ">=3.11"

[project.urls]
Homepage = "https://github.com/GrindelfP/project-skuld"
Repository = "https://github.com/GrindelfP/project-skuld"
Issues = "https://github.com/GrindelfP/project-skuld/issues"

[tool.setuptools.packages.find]
include = ["skuld*"]